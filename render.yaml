# Blueprint deploy NutriLokal untuk Render.
#
# Arsitektur:
#   - PostgreSQL  : NEON (eksternal) — set DATABASE_URL manual di dashboard.
#   - Backend     : Render Web Service (folder backend/).
#   - Frontend    : Render Static Site (folder frontend/).
#
# Petunjuk lengkap ada di DEPLOY_RENDER_NEON.md.
#
# CATATAN PENTING:
# - Nilai `sync: false` berarti diisi manual di dashboard Render (jangan
#   ditulis di file ini) agar rahasia tidak masuk ke repositori.
# - Foto produk disimpan di CLOUDINARY (bukan Render Disk), sehingga tetap
#   persisten pada paket gratis dan tidak bergantung pada volume Render.
# - Render free service "tidur" setelah idle; request pertama bisa lambat.

services:
  # ---------------------------------------------------------------------------
  # Backend API (Express + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: nutrilokal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    # Migrasi dijalankan sebelum server start (idempoten, aman diulang).
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Penyimpanan foto di Cloudinary (persisten tanpa Render Disk).
      # Isi ketiganya; bila kosong aplikasi jatuh ke penyimpanan lokal.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend (Vite static build + SPA fallback)
  # ---------------------------------------------------------------------------
  - type: web
    name: nutrilokal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback: semua rute klien (/ , /catalog, /qr/:code, /login, ...)
      # diarahkan ke index.html agar tidak 404 saat dibuka langsung.
      - type: rewrite
        source: /*
        destination: /index.html
